name: Build Vesper

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Fetch WebView2 SDK + WIL via NuGet
      shell: cmd
      run: |
        nuget install Microsoft.Web.WebView2 -OutputDirectory packages -ExcludeVersion
        nuget install Microsoft.Windows.ImplementationLibrary -OutputDirectory packages -ExcludeVersion

    - name: Build executor DLL
      shell: cmd
      run: |
        cl /nologo /std:c++17 /EHsc /O2 /MT /LD executor_dll.cpp user32.lib shell32.lib winhttp.lib psapi.lib /link /OUT:executor_dll.dll /SUBSYSTEM:WINDOWS

    - name: Compile resources
      shell: cmd
      run: rc /nologo /fo vesper.res vesper.rc

    - name: Build vesper.exe
      shell: cmd
      run: |
        cl /nologo /std:c++17 /EHsc /O2 /MT /DUNICODE /D_UNICODE /I "packages\Microsoft.Web.WebView2\build\native\include" /I "packages\Microsoft.Windows.ImplementationLibrary\include" vesper.cpp vesper.res "packages\Microsoft.Web.WebView2\build\native\x64\WebView2LoaderStatic.lib" user32.lib shell32.lib ole32.lib advapi32.lib /link /OUT:vesper.exe /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup

    - name: Upload vesper.exe as artifact
      uses: actions/upload-artifact@v4
      with:
        name: vesper
        path: vesper.exe
        if-no-files-found: error
