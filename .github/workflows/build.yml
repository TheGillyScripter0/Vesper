name: Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Dependencies
      shell: cmd
      run: |
        nuget install Microsoft.Web.WebView2 -OutputDirectory packages -ExcludeVersion
        nuget install Microsoft.Windows.ImplementationLibrary -OutputDirectory packages -ExcludeVersion

    - name: Rename vendored core
      shell: cmd
      run: |
        if exist quorum\QuorumAPI.dll copy quorum\QuorumAPI.dll quorum\vesper_core.dll

    - name: Resources
      shell: cmd
      run: |
        rc /nologo /fo vesper.res vesper.rc
        rc /nologo /fo installer.res installer.rc

    - name: Native (vesper.exe)
      shell: cmd
      run: |
        cl /nologo /std:c++17 /EHsc /O2 /MT /DUNICODE /D_UNICODE /I "packages\Microsoft.Web.WebView2\build\native\include" /I "packages\Microsoft.Windows.ImplementationLibrary\include" vesper.cpp vesper.res "packages\Microsoft.Web.WebView2\build\native\x64\WebView2LoaderStatic.lib" user32.lib shell32.lib ole32.lib advapi32.lib /link /OUT:vesper.exe /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup

    - name: Native (vesper-setup.exe)
      shell: cmd
      run: |
        cl /nologo /std:c++17 /EHsc /O2 /MT /DUNICODE /D_UNICODE installer.cpp installer.res user32.lib gdi32.lib shell32.lib shlwapi.lib ole32.lib oleaut32.lib uuid.lib winhttp.lib comctl32.lib /link /OUT:vesper-setup.exe /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup

    - name: Managed
      shell: cmd
      run: dotnet build QuorumBridge.csproj -c Release -o build-cs

    - name: Write version.txt
      shell: cmd
      run: echo %GITHUB_SHA:~0,7% > version.txt

    - name: Package main app
      shell: cmd
      run: |
        mkdir dist
        mkdir dist\lib
        copy vesper.exe dist\
        copy vesper-setup.exe dist\
        copy version.txt dist\
        copy build-cs\vesper_svc.exe dist\lib\
        copy quorum\vesper_core.dll dist\lib\
        if exist quorum\bin xcopy /E /I /Y quorum\bin dist\lib\bin
        if exist quorum\erto3e4rortoergn.exe copy quorum\erto3e4rortoergn.exe dist\lib\
        if exist quorum\Decompiler.exe copy quorum\Decompiler.exe dist\lib\
        if exist quorum\current_version.txt copy quorum\current_version.txt dist\lib\

    - name: Create vesper.zip
      shell: pwsh
      run: Compress-Archive -Path dist\* -DestinationPath vesper.zip -Force

    - uses: actions/upload-artifact@v4
      with:
        name: vesper
        path: vesper.zip
        if-no-files-found: error

    - uses: actions/upload-artifact@v4
      with:
        name: vesper-setup
        path: vesper-setup.exe
        if-no-files-found: error

    - uses: actions/upload-artifact@v4
      with:
        name: version
        path: version.txt
        if-no-files-found: error
